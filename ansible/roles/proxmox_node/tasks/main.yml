---
- name: Disable the enterprise (paid) pve repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-enterprise.list
    content: "# managed by ansible: enterprise repo disabled, requires subscription\n"
    mode: "0644"
  when: proxmox_use_no_subscription_repo

- name: Enable the pve no-subscription repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pve-no-subscription.list
    content: "deb http://download.proxmox.com/debian/pve {{ ansible_distribution_release }} pve-no-subscription\n"
    mode: "0644"
  when: proxmox_use_no_subscription_repo
  register: pve_repo_changed

- name: apt update after repo change
  ansible.builtin.apt:
    update_cache: true
  when: pve_repo_changed.changed

- name: Full upgrade of the Proxmox host
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    cache_valid_time: 3600

- name: Check if a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Warn if reboot is pending
  ansible.builtin.debug:
    msg: "El nodo {{ inventory_hostname }} necesita reiniciar (kernel actualizado). Coordinar el reinicio manualmente para no tirar VMs activas."
  when: reboot_required.stat.exists
