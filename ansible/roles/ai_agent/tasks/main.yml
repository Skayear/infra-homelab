---
- name: Create compose directory
  ansible.builtin.file:
    path: "{{ ai_agent_compose_dir }}"
    state: directory
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ai_agent_compose_dir }}/docker-compose.yml"
    mode: "0640"

- name: Start the agent via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ ai_agent_compose_dir }}"
    state: present
    pull: "missing"
