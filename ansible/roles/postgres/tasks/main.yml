---
- name: Assert that postgres_password was provided (via vault)
  ansible.builtin.assert:
    that: postgres_password is defined
    fail_msg: >
      postgres_password no esta definida. Crear un vault
      (ver ansible/inventory/group_vars/<grupo>/vault.yml) con esta variable
      antes de correr este role.

- name: Create compose directory
  ansible.builtin.file:
    path: "{{ postgres_compose_dir }}"
    state: directory
    mode: "0750"

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ postgres_compose_dir }}/docker-compose.yml"
    mode: "0640"
  register: postgres_compose

- name: Start postgres via docker compose
  community.docker.docker_compose_v2:
    project_src: "{{ postgres_compose_dir }}"
    state: present
    pull: "missing"
