# Nodos fisicos "fijos" del homelab.
# Los VMs/LXC creados por OpenTofu se descubren aparte via inventory/proxmox.yml
# (inventario dinamico), no se listan a mano aca.
all:
  children:
    proxmox_nodes:
      hosts:
        pve-notebook:
          ansible_host: 192.168.1.10   # TODO: IP real de la notebook
      vars:
        ansible_user: root

    raspberry_pi:
      hosts:
        rpi-agent:
          ansible_host: 192.168.1.20   # TODO: IP real de la Raspberry Pi
      vars:
        ansible_user: pablo
